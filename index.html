<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Legacy Code Explainer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">EXPLORER</span>
    </div>

    <div class="index-section">
      <input type="text" id="github-url" placeholder="https://github.com/user/repo" />
      <button id="index-btn" onclick="indexRepo()">Index</button>
      <div id="index-status" class="status-msg"></div>
    </div>

    <div class="sidebar-section-label">INDEXED FILES</div>
    <ul id="file-list"></ul>
  </aside>

  <!-- MAIN CHAT -->
  <main id="chat-panel">
    <div class="chat-header">
      <span class="chat-title">Legacy Code Explainer</span>
    </div>

    <div id="messages"></div>

    <div class="chat-input-area">
      <textarea id="query-input" placeholder="Ask about the codebase..." rows="2" onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
